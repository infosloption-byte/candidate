server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Document uploads travel as JSON (backend bodyLimit is 8 MB); leave some headroom.
    client_max_body_size 12m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Docker's embedded DNS. Using a variable in proxy_pass makes nginx re-resolve the API
    # container's IP, so recreating/restarting buildhire_api never leaves nginx with a stale address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_upstream http://buildhire_api:4000;
        proxy_pass $api_upstream;           # no URI part => the original /api/v1/... path is passed through
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    # Vite output files are content-hashed -> safe to cache for a year
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The SPA shell: never cached (so a new deploy shows up immediately) + security headers.
    # Every route falls back to this via try_files below.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA fallback (deep links / refresh on client-side routes)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
