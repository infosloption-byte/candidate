name: Backend CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "TASKS.md"
      - "docs/BUILD_PLAN.md"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "TASKS.md"
      - "docs/BUILD_PLAN.md"
      - ".github/workflows/backend-ci.yml"

jobs:
  backend:
    runs-on: ubuntu-22.04
    env:
      DATABASE_URL: mysql://candidate_erp:password@127.0.0.1:3306/construction_candidate_erp
      RUN_DB_TESTS: "1"
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: construction_candidate_erp
          MYSQL_USER: candidate_erp
          MYSQL_PASSWORD: password
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Prisma Client
        run: npm run prisma:generate
      - name: Validate Prisma schema
        run: npm run prisma:validate
      - name: Apply test database migration
        run: npm run prisma:migrate:deploy
      - name: Run backend tests
        run: npm test
      - name: Build backend
        run: npm run build
