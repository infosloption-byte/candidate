name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "TASKS.md"
      - "docs/BUILD_PLAN.md"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "TASKS.md"
      - "docs/BUILD_PLAN.md"
      - ".github/workflows/backend-ci.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Prisma Client
        env:
          DATABASE_URL: mysql://candidate_erp:password@127.0.0.1:3306/construction_candidate_erp
        run: npm run prisma:generate
      - name: Validate Prisma schema
        env:
          DATABASE_URL: mysql://candidate_erp:password@127.0.0.1:3306/construction_candidate_erp
        run: npm run prisma:validate
      - name: Run backend tests
        run: npm test
      - name: Build backend
        run: npm run build
