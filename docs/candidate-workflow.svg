<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">BuildHire candidate workflow UX</title>
  <desc id="desc">A responsive candidate workflow from quick add through screening, interview, selection, reserve, or rejection.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="1280" height="760" fill="#f6f8fb"/>
  <text x="64" y="64" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="800" fill="#0f172a">BuildHire — Candidate workflow UX</text>
  <text x="64" y="94" font-family="Inter,Arial,sans-serif" font-size="15" fill="#64748b">One candidate record, progressive data capture, visible job-fit evidence, and explainable decisions.</text>

  <g filter="url(#shadow)">
    <rect x="64" y="140" width="250" height="150" rx="22" fill="#0f172a"/>
    <text x="88" y="176" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#67e8f9" letter-spacing="2">1 · ADD</text>
    <text x="88" y="208" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="800" fill="#fff">Quick intake</text>
    <text x="88" y="232" font-family="Inter,Arial,sans-serif" font-size="13" fill="#cbd5e1">Essentials → Trade → Readiness</text>
    <text x="88" y="256" font-family="Inter,Arial,sans-serif" font-size="12" fill="#94a3b8">No giant form. Mobile-first drawer.</text>
  </g>
  <line x1="314" y1="215" x2="390" y2="215" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="390" y="140" width="250" height="150" rx="22" fill="#fff" stroke="#dbe2ea"/>
    <text x="414" y="176" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#0891b2" letter-spacing="2">2 · PROFILE</text>
    <text x="414" y="208" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="800" fill="#0f172a">Candidate workspace</text>
    <text x="414" y="233" font-family="Inter,Arial,sans-serif" font-size="13" fill="#64748b">Search, filter, inspect, act</text>
    <text x="414" y="256" font-family="Inter,Arial,sans-serif" font-size="12" fill="#94a3b8">Directory + profile split on desktop.</text>
  </g>
  <line x1="640" y1="215" x2="716" y2="215" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="716" y="140" width="250" height="150" rx="22" fill="#ecfeff" stroke="#a5f3fc"/>
    <text x="740" y="176" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#0e7490" letter-spacing="2">3 · SCREEN</text>
    <text x="740" y="208" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="800" fill="#0f172a">Job-fit evidence</text>
    <text x="740" y="233" font-family="Inter,Arial,sans-serif" font-size="13" fill="#0f766e">Experience · skills · readiness</text>
    <text x="740" y="256" font-family="Inter,Arial,sans-serif" font-size="12" fill="#0e7490">Start screening or schedule interview.</text>
  </g>
  <line x1="966" y1="215" x2="1042" y2="215" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="1042" y="140" width="174" height="150" rx="22" fill="#fff" stroke="#dbe2ea"/>
    <text x="1066" y="176" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#0891b2" letter-spacing="2">4 · INTERVIEW</text>
    <text x="1066" y="208" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="800" fill="#0f172a">Structured</text>
    <text x="1066" y="232" font-family="Inter,Arial,sans-serif" font-size="13" fill="#64748b">Interviewer + scorecard</text>
    <text x="1066" y="256" font-family="Inter,Arial,sans-serif" font-size="12" fill="#94a3b8">Next MVP module.</text>
  </g>

  <text x="64" y="352" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800" fill="#0f172a">Candidate profile state model</text>
  <g filter="url(#shadow)">
    <rect x="64" y="380" width="1152" height="112" rx="22" fill="#fff" stroke="#dbe2ea"/>
    <g font-family="Inter,Arial,sans-serif">
      <text x="98" y="415" font-size="12" font-weight="800" fill="#475569">NEW</text><text x="98" y="440" font-size="12" fill="#64748b">Start screening</text>
      <text x="276" y="415" font-size="12" font-weight="800" fill="#b45309">SCREENING</text><text x="276" y="440" font-size="12" fill="#64748b">Confirm job fit</text>
      <text x="492" y="415" font-size="12" font-weight="800" fill="#0e7490">INTERVIEW</text><text x="492" y="440" font-size="12" fill="#64748b">Evaluate + score</text>
      <text x="708" y="415" font-size="12" font-weight="800" fill="#047857">SELECTED</text><text x="708" y="440" font-size="12" fill="#64748b">Shortlist approved</text>
      <text x="906" y="415" font-size="12" font-weight="800" fill="#6d28d9">RESERVE</text><text x="906" y="440" font-size="12" fill="#64748b">Keep available</text>
      <text x="1082" y="415" font-size="12" font-weight="800" fill="#be123c">REJECTED</text><text x="1082" y="440" font-size="12" fill="#64748b">Reason is required</text>
    </g>
  </g>

  <text x="64" y="545" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800" fill="#0f172a">Decision safety rails</text>
  <g font-family="Inter,Arial,sans-serif">
    <g filter="url(#shadow)"><rect x="64" y="570" width="345" height="116" rx="20" fill="#fff" stroke="#dbe2ea"/><text x="88" y="605" font-size="13" font-weight="800" fill="#0f172a">Explainable rejection</text><text x="88" y="630" font-size="12" fill="#64748b">Every rejection captures a primary</text><text x="88" y="649" font-size="12" fill="#64748b">reason plus an interviewer note.</text></g>
    <g filter="url(#shadow)"><rect x="436" y="570" width="345" height="116" rx="20" fill="#fff" stroke="#dbe2ea"/><text x="460" y="605" font-size="13" font-weight="800" fill="#0f172a">Persistent candidate history</text><text x="460" y="630" font-size="12" fill="#64748b">Status changes and decisions appear</text><text x="460" y="649" font-size="12" fill="#64748b">in the journey instead of disappearing.</text></g>
    <g filter="url(#shadow)"><rect x="808" y="570" width="408" height="116" rx="20" fill="#ecfeff" stroke="#a5f3fc"/><text x="832" y="605" font-size="13" font-weight="800" fill="#0e7490">Responsive by default</text><text x="832" y="630" font-size="12" fill="#0e7490">Desktop: collapsed sidebar + split workspace.</text><text x="832" y="649" font-size="12" fill="#0e7490">Mobile: slide-over menu + single-panel flow.</text></g>
  </g>
</svg>
