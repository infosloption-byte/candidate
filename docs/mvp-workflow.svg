</g>
<rect x="375" y="660" width="935" height="96" rx="18" fill="#020617"/><text x="405" y="696" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#93c5fd">REJECTION RULE</text><text x="405" y="723" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">A rejection always captures a reason + interviewer note.</text><text x="405" y="744" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">This makes reports actionable and prevents the “why did we fail this person?” problem from returning.</text>
</svg>
