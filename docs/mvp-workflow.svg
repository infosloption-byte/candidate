<text x="815" y="263" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#475569">RIGHT — PROFILE</text>
<text x="815" y="300" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#0f172a">Kasun Perera</text><text x="815" y="323" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Mason · 9 years · Gampaha</text>
