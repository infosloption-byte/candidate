<text x="815" y="360" font-family="Arial, sans-serif" font-size="12" fill="#334155">✓ 9 years experience</text><text x="815" y="381" font-family="Arial, sans-serif" font-size="12" fill="#334155">✓ Tile + Putty</text><text x="815" y="402" font-family="Arial, sans-serif" font-size="12" fill="#334155">✓ Overseas experience</text><text x="815" y="430" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Documents, work history, interview evidence and timeline</text><text x="815" y="446" font-family="Arial, sans-serif" font-size="11" fill="#64748b">remain visible without leaving the profile workspace.</text>
